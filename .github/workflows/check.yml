name: Withdraw mismatched ethics October 14 summary and retry later
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome
      - name: Back up and requeue only the confirmed mismatched record
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
            LATEST_SHA=$(git rev-parse refs/remotes/origin/data)
            git push origin "$LATEST_SHA:refs/heads/backup/ethics-oct14-pending-${GITHUB_RUN_ID}-$attempt"
            rm -rf recovery
            mkdir -p recovery/latest
            git archive "$LATEST_SHA" data | tar -x -C recovery/latest
            python scripts/db_shard.py reassemble recovery/latest/data recovery/latest.db
            cp recovery/latest.db recovery/before.db
            python scripts/requeue_ethics_oct14.py recovery/latest.db
            python scripts/verify_ethics_oct14_pending.py recovery/before.db recovery/latest.db
            python scripts/db_shard.py shard recovery/latest.db recovery/output
            git worktree add --detach recovery/deploy "$LATEST_SHA"
            cp recovery/output/icourse-index.enc recovery/deploy/data/
            rm -rf recovery/deploy/data/shards
            cp -R recovery/output/shards recovery/deploy/data/shards
            git -C recovery/deploy add data
            git -C recovery/deploy commit -m 'fix: withdraw mismatched ethics October 14 captions and await recording'
            REPAIR_SHA=$(git -C recovery/deploy rev-parse HEAD)
            git worktree remove recovery/deploy
            if git push --force-with-lease="refs/heads/data:$LATEST_SHA" origin "$REPAIR_SHA:refs/heads/data"; then
              exit 0
            fi
            echo 'Remote data changed; retrying against its latest version.'
          done
          exit 1
      - name: Verify published database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
          mkdir -p recovery/published
          git archive refs/remotes/origin/data data | tar -x -C recovery/published
          python scripts/db_shard.py reassemble recovery/published/data recovery/published.db
          python scripts/verify_ethics_oct14_pending.py recovery/before.db recovery/published.db
      - name: Delete temporary plaintext databases
        if: always()
        run: rm -rf recovery
