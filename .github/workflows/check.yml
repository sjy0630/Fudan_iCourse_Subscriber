name: Verify two course backlog recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome
      - name: Compare backup and saved database read-only
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          mkdir -p "$RUNNER_TEMP/backlog-verify/backup" "$RUNNER_TEMP/backlog-verify/latest"
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data +refs/heads/backup/two-course-backlog-recovery-38390615872:refs/remotes/origin/ethics-backup
          git rev-parse refs/remotes/origin/data refs/remotes/origin/ethics-backup
          git archive refs/remotes/origin/ethics-backup data | tar -x -C "$RUNNER_TEMP/backlog-verify/backup"
          git archive refs/remotes/origin/data data | tar -x -C "$RUNNER_TEMP/backlog-verify/latest"
          python scripts/db_shard.py reassemble "$RUNNER_TEMP/backlog-verify/backup/data" "$RUNNER_TEMP/backlog-verify/backup.db"
          python scripts/db_shard.py reassemble "$RUNNER_TEMP/backlog-verify/latest/data" "$RUNNER_TEMP/backlog-verify/latest.db"
          python scripts/verify_backlog_recovery.py "$RUNNER_TEMP/backlog-verify/backup.db" "$RUNNER_TEMP/backlog-verify/latest.db"
      - name: Delete temporary databases
        if: always()
        run: rm -rf "$RUNNER_TEMP/backlog-verify"
