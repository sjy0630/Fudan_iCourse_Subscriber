name: Read-only playback metadata diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentication dependencies
        run: pip install requests pycryptodome
      - name: Inspect playback metadata only
        timeout-minutes: 10
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
        run: python -u scripts/diagnose_playback_metadata.py
