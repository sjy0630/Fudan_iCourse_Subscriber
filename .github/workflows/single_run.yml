name: Recover three lectures after stereo fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Cache ASR models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/
            silero_vad.onnx
          key: asr-models-sense-voice-2024-07-17
      - name: Download missing models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xf sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          rm sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      - name: Preserve encrypted database before recovery
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          mkdir -p recovery/base
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
          BASE_SHA=$(git rev-parse refs/remotes/origin/data)
          git push origin "$BASE_SHA:refs/heads/backup/audio-recovery-${GITHUB_RUN_ID}"
          git archive "$BASE_SHA" data | tar -x -C recovery/base
          python scripts/db_shard.py reassemble recovery/base/data recovery/base.db
      - name: Regenerate only the three confirmed lectures
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          USE_OFFICIAL_TRANSCRIPT: '0'
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
        run: python -u scripts/recover_three_lectures.py process recovery/base.db recovery/candidate.db
      - name: Apply successful results to the latest encrypted database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
            LATEST_SHA=$(git rev-parse refs/remotes/origin/data)
            rm -rf recovery/latest recovery/output recovery/latest.db
            mkdir -p recovery/latest
            git archive "$LATEST_SHA" data | tar -x -C recovery/latest
            python scripts/db_shard.py reassemble recovery/latest/data recovery/latest.db
            python scripts/recover_three_lectures.py apply recovery/candidate.db recovery/latest.db
            python scripts/db_shard.py shard recovery/latest.db recovery/output
            git worktree add --detach recovery/deploy "$LATEST_SHA"
            cp recovery/output/icourse-index.enc recovery/deploy/data/
            rm -rf recovery/deploy/data/shards
            cp -R recovery/output/shards recovery/deploy/data/shards
            git -C recovery/deploy add data
            git -C recovery/deploy commit -m 'fix: regenerate three lectures with corrected stereo audio'
            RECOVERY_SHA=$(git -C recovery/deploy rev-parse HEAD)
            git worktree remove recovery/deploy
            if git push --force-with-lease="refs/heads/data:$LATEST_SHA" origin "$RECOVERY_SHA:refs/heads/data"; then
              exit 0
            fi
            echo 'Data branch changed during recovery; applying to its latest version.'
          done
          echo 'Could not publish without overwriting concurrent work.'
          exit 1
      - name: Delete temporary audio and decrypted databases
        if: always()
        run: |
          rm -rf recovery
